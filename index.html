.hero small{opacity:.9;font-size:13px}.hero h1{margin:2px 0 0;font-size:28px;letter-spacing:-.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-top:14px}
h2{font-size:15px;margin:0 0 12px;font-weight:600}h2.t{font-size:22px;margin:6px 0 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.stat span{font-size:12px;color:var(--mu)}.stat b{display:block;font-size:17px;margin-top:4px}
label{font-size:12px;color:var(--mu);display:block;margin:12px 0 6px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--pr)}
.btn{width:100%;margin-top:16px;padding:15px;border:0;border-radius:16px;background:var(--pr);color:#fff;font-size:16px;font-weight:600}
.btn:active{transform:scale(.98)}.ghost{background:var(--soft);color:var(--bad);margin-top:10px}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:46px;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font-size:22px}.qty input{text-align:center}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:14px;border-radius:14px;background:var(--soft)}.total b{font-size:20px;color:var(--pr)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0;padding-bottom:0}
.row small,.sm{color:var(--mu);display:block;margin-top:2px;font-size:12px}
.pill{font-size:12px;padding:7px 11px;border-radius:99px;background:var(--soft);color:var(--pr);border:0;font-weight:600}
.pill.a{background:var(--pr);color:#fff}
.bar{height:6px;border-radius:9px;background:var(--soft);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px}

.mon{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.mon b{font-size:16px}
.mon button{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px}.mon button:disabled{opacity:.3}
.legend span{font-size:12px;color:var(--mu);margin-right:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:5}
nav div{pointer-events:auto;width:100%;max-width:456px;display:flex;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:6px;box-shadow:0 8px 24px rgba(63,162,230,.18)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0;border-radius:16px;font-size:11px}
nav button span{display:block;font-size:19px;margin-bottom:1px}nav button.on{background:var(--soft);color:var(--pr);font-weight:600}
.ov{position:fixed;inset:0;background:rgba(10,30,50,.45);display:flex;align-items:flex-end;z-index:20}
.sh{width:100%;max-width:480px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;transition:.3s;z-index:30}
#toast.show{transform:translate(-50%,0)}
.empty{color:var(--mu);font-size:14px;text-align:center;padding:14px 0}
svg text{fill:var(--mu);font-size:10px}
</style></head>
<body>
<div id="toast"></div><div id="app"></div><div id="sheet"></div>
<nav><div id="nav"></div></nav>

<script src="app.js"></script>
<script src="sync.js"></script>
<script>
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body></html>
